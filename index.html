<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diario de embarazo — Reggina</title>
<style>
  :root{
    --paper: #F6EFEA;
    --paper-card: #FCFAF6;
    --thread: #A6516B;
    --thread-deep: #7C3B52;
    --thread-soft: #E4D6CE;
    --sage: #6E7C57;
    --sage-soft: #DCE3D2;
    --gold: #B98A3E;
    --gold-soft: #EFE0C3;
    --ink: #2E2620;
    --ink-soft: #7A6C61;
    --hair: #DED2C6;
    --display: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    --body: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(166,81,107,0.05), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(110,124,87,0.06), transparent 45%);
    color: var(--ink);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
  }

  .page{
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 20px 64px;
  }

  /* ---------- Header ---------- */
  .masthead{
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 28px;
    padding-bottom: 18px;
    border-bottom: 1px dashed var(--hair);
  }
  .masthead-left{ display:flex; flex-direction: column; gap: 2px; }
  .eyebrow{
    font-family: var(--display);
    font-style: italic;
    font-size: 14px;
    letter-spacing: 0.04em;
    color: var(--thread-deep);
  }
  .masthead h1{
    font-family: var(--display);
    font-weight: 700;
    font-size: 34px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .badge{
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--sage);
    background: var(--sage-soft);
    padding: 7px 14px;
    border-radius: 100px;
    white-space: nowrap;
    align-self: center;
  }

  /* ---------- Hero ---------- */
  .hero-card{
    background: var(--paper-card);
    border: 1px solid var(--hair);
    border-radius: 22px;
    padding: 30px 30px 24px;
    display: grid;
    grid-template-columns: minmax(260px, 380px) 1fr;
    align-items: center;
    gap: 12px;
    box-shadow: 0 1px 0 rgba(46,38,32,0.02), 0 18px 40px -28px rgba(46,38,32,0.35);
    margin-bottom: 22px;
  }

  .dial-wrap{ position: relative; }
  .dial-wrap svg{ width: 100%; height: auto; display:block; }
  .tick-unstitched{ stroke: var(--thread-soft); }
  .tick-stitched{ stroke: var(--thread); }
  .tick-boundary.tick-unstitched{ stroke: #D8C6BB; }
  .tick-boundary.tick-stitched{ stroke: var(--thread-deep); }
  .dial-label{
    font-family: var(--body);
    font-size: 10.5px;
    fill: var(--ink-soft);
    text-anchor: middle;
  }
  .marker{
    fill: var(--gold);
    stroke: var(--paper-card);
    stroke-width: 3;
    animation: pulse 2.6s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  @media (prefers-reduced-motion: reduce){ .marker{ animation: none; } }
  @keyframes pulse{
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.35); }
  }

  .hero-figures{
    display:flex;
    align-items: baseline;
    gap: 10px;
    justify-content: center;
  }
  .hero-number{
    font-family: var(--display);
    font-weight: 700;
    font-size: 96px;
    line-height: 1;
    color: var(--thread-deep);
  }
  .hero-unit{
    font-family: var(--display);
    font-style: italic;
    font-size: 22px;
    color: var(--ink-soft);
  }

  .hero-text{ padding-left: 6px; }
  .hero-precise{
    font-size: 16px;
    color: var(--ink);
    margin: 2px 0 0;
  }
  .hero-precise b{ font-weight: 700; }
  .hero-trimestre{
    display:inline-block;
    margin-top: 10px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--gold);
    background: var(--gold-soft);
    padding: 5px 12px;
    border-radius: 100px;
  }
  .hero-fpp{
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--hair);
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.5;
  }
  .hero-fpp b{ color: var(--ink); font-weight: 700; }

  @media (max-width: 640px){
    .hero-card{ grid-template-columns: 1fr; text-align:center; }
    .hero-text{ padding-left: 0; }
    .hero-number{ font-size: 76px; }
  }

  /* ---------- Size hero (comparación con objetos) ---------- */
  .size-hero{
    background: var(--paper-card);
    border: 1px solid var(--hair);
    border-radius: 22px;
    padding: 22px 28px;
    display: flex;
    align-items: center;
    gap: 22px;
    box-shadow: 0 1px 0 rgba(46,38,32,0.02), 0 14px 32px -26px rgba(46,38,32,0.3);
    margin-bottom: 22px;
  }
  .size-emoji{
    font-size: 52px;
    line-height: 1;
    flex-shrink: 0;
    width: 84px;
    height: 84px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--sage-soft);
    border-radius: 50%;
  }
  .size-copy{ flex: 1; min-width: 0; }
  .size-headline{
    font-family: var(--display);
    font-size: 20px;
    margin: 0 0 4px;
  }
  .size-headline b{ color: var(--thread-deep); }
  .size-caption{
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin: 0;
  }
  @media (max-width: 640px){
    .size-hero{ flex-direction: column; text-align: center; }
  }

  /* ---------- Cards grid ---------- */
  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 16px;
  }
  .card{
    background: var(--paper-card);
    border: 1px solid var(--hair);
    border-top: 3px dashed var(--thread-soft);
    border-radius: 16px;
    padding: 20px 20px 18px;
  }
  .card h2{
    font-family: var(--display);
    font-size: 13px;
    font-style: italic;
    font-weight: normal;
    letter-spacing: 0.02em;
    color: var(--thread-deep);
    margin: 0 0 12px;
  }
  .row{
    display:flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 14px;
    padding: 7px 0;
    border-bottom: 1px solid #F0E9E2;
  }
  .row:last-child{ border-bottom: none; }
  .row .k{ color: var(--ink-soft); }
  .row .v{ text-align: right; font-weight: 600; }

  .list{ list-style: none; margin:0; padding:0; }
  .list li{
    display:flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 13.5px;
    padding: 8px 0;
    border-bottom: 1px solid #F0E9E2;
  }
  .list li:last-child{ border-bottom: none; }
  .list-text{
    display:flex;
    flex-direction: column;
    gap: 2px;
  }
  .list .date{
    font-size: 11px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--sage);
    font-weight: 700;
  }
  .list.pendiente .date{ color: var(--gold); }
  .link-icon{
    flex-shrink: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    width: 26px;
    height: 26px;
    border-radius: 100px;
    color: var(--thread-deep);
    background: var(--thread-soft);
    transition: background 0.15s ease;
  }
  .link-icon:hover{ background: var(--gold-soft); color: var(--gold); }
  .link-icon svg{ width: 13px; height: 13px; }

  .tags{ display:flex; flex-wrap: wrap; gap: 6px; }
  .tag{
    font-size: 12.5px;
    padding: 5px 11px;
    border-radius: 100px;
    background: var(--sage-soft);
    color: var(--sage);
    font-weight: 600;
  }
  .tag.med{ background: var(--gold-soft); color: var(--gold); }

  .muted{ color: var(--ink-soft); font-size: 13px; line-height: 1.5; }

  .card.turno .row .v{ color: var(--thread-deep); }
  .turno-days{
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  footer{
    margin-top: 30px;
    text-align: center;
    font-size: 11.5px;
    color: var(--ink-soft);
  }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script>
// ---------------------------------------------------------------
// Parseo del YAML embebido de arriba. No editar acá — editar el
// bloque <script type="text/yaml"> con los datos.
// ---------------------------------------------------------------
// Se usa JSON_SCHEMA para que las fechas (ej. 2026-06-14) queden como texto
// y no como objetos Date auto-convertidos por YAML (eso podía correr un día
// por huso horario). parseDate() abajo sigue interpretando ese texto.
const DATA = jsyaml.load(
  document.getElementById("data-yaml").textContent,
  { schema: jsyaml.JSON_SCHEMA }
).embarazo;

// ---------------------------------------------------------------
// Helpers de fecha
// ---------------------------------------------------------------
function parseDate(s){
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y, m-1, d);
}
function diffDays(a, b){
  const MS = 24*60*60*1000;
  const da = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const db = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((db - da) / MS);
}
function fmtLong(dateObj){
  return dateObj.toLocaleDateString("es-AR", { day:"numeric", month:"long", year:"numeric" });
}
function fmtWeekday(dateObj){
  const s = dateObj.toLocaleDateString("es-AR", { weekday:"long" });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function fmtShort(dateObj){
  return dateObj.toLocaleDateString("es-AR", { day:"numeric", month:"short" });
}
// Semana y día de gestación correspondientes a una fecha dada, a partir de la FUM.
function gestLabelFor(dateObj, fumDateObj){
  const d = diffDays(fumDateObj, dateObj);
  const w = Math.floor(d / 7);
  const r = d % 7;
  return `${w} semana${w===1?"":"s"}${r ? " y " + r + (r===1?" día":" días") : ""}`;
}

// ---------------------------------------------------------------
// Tamaño aproximado por semana — curva de crecimiento y comparación
// con objetos cotidianos.
//
// La curva está anclada a 3 puntos conocidos: semana 6 (0,28 cm),
// semana 8 (1,65 cm) y semana 40 (50 cm). Entre semana 6 y 8 se usa
// una curva exponencial (crecimiento embrionario temprano, muy
// acelerado); entre semana 8 y 40 una curva potencial (se va
// aplanando hacia el final). Fuera de ese rango, el valor queda fijo
// en el extremo más cercano. Si en algún momento se suman más puntos
// de referencia (por ej. semana 20), conviene partir la curva en más
// tramos para que sea más precisa en el medio.
const SIZE_ANCHORS = { t1: 6, l1: 0.28, t2: 8, l2: 1.65, t3: 12, l3: 5.5, t4: 40, l4: 50 };

function fetalSizeCm(gestDaysExact){
  const t = gestDaysExact / 7; // semana de gestación, en decimales
  const { t1, l1, t2, l2, t3, l3, t4, l4 } = SIZE_ANCHORS;
  if (t <= t1) return l1;
  if (t <= t2){
    const k = Math.log(l2 / l1) / (t2 - t1);
    return l1 * Math.exp(k * (t - t1));
  }
  if (t <= t3){
    const b = Math.log(l3 / l2) / Math.log(t3 / t2);
    const a = l2 / Math.pow(t2, b);
    return a * Math.pow(t, b);
  }
  if (t <= t4){
    const b = Math.log(l4 / l3) / Math.log(t4 / t3);
    const a = l3 / Math.pow(t3, b);
    return a * Math.pow(t, b);
  }
  return l4;
}

// Objetos de referencia (tamaño típico en cm) para comparar el resultado.
const SIZE_REFERENCE = [
  { cm: 0.6,  label: "un grano de pimienta",            emoji: "⚫" },
  { cm: 1.9,  label: "un arándano grande",               emoji: "🫐" },
  { cm: 3.1,  label: "una aceituna",                     emoji: "🫒" },
  { cm: 4.4,  label: "una nuez",                         emoji: "🌰" },
  { cm: 5.7,  label: "un huevo de codorniz",             emoji: "🥚" },
  { cm: 6.9,  label: "una lima",                         emoji: "🍋" },
  { cm: 8.2,  label: "un kiwi",                          emoji: "🥝" },
  { cm: 9.5,  label: "una pelota de tenis",              emoji: "🎾" },
  { cm: 10.7, label: "una mandarina",                    emoji: "🍊" },
  { cm: 12,   label: "una manzana pequeña",              emoji: "🍎" },
  { cm: 13.3, label: "una pera",                         emoji: "🍐" },
  { cm: 14.5, label: "un mango",                         emoji: "🥭" },
  { cm: 15.8, label: "un durazno",                       emoji: "🍑" },
  { cm: 17.1, label: "un pomelo pequeño",                emoji: "🍈" },
  { cm: 18.3, label: "una papa",                         emoji: "🥔" },
  { cm: 19.6, label: "un control remoto",                emoji: "📱" },
  { cm: 20.9, label: "una botella de agua de 500 ml",    emoji: "🧴" },
  { cm: 22.1, label: "una berenjena",                    emoji: "🍆" },
  { cm: 23.4, label: "un pepino",                        emoji: "🥒" },
  { cm: 24.7, label: "un zucchini",                      emoji: "🥒" },
  { cm: 27.2, label: "una zapatilla",                    emoji: "👟" },
  { cm: 28.5, label: "una piña",                         emoji: "🍍" },
  { cm: 31,   label: "una botella de vino",              emoji: "🍾" },
  { cm: 32.3, label: "un melón pequeño",                 emoji: "🍈" },
  { cm: 33.5, label: "una calabaza",                     emoji: "🎃" },
  { cm: 34.8, label: "una botella de 1 litro",           emoji: "🧴" },
  { cm: 37.3, label: "una calabaza anco",                emoji: "🎃" },
  { cm: 38.6, label: "un melón grande",                  emoji: "🍈" },
  { cm: 39.9, label: "una licuadora",                    emoji: "🥤" },
  { cm: 41.1, label: "una sandía pequeña",               emoji: "🍉" },
  { cm: 42.4, label: "un conejo pequeño",                emoji: "🐰" },
  { cm: 43.7, label: "una almohada pequeña",             emoji: "🛏️" },
  { cm: 46.2, label: "una botella de gaseosa de 2 L",    emoji: "🧴" },
  { cm: 47.5, label: "una sandía mediana",               emoji: "🍉" },
  { cm: 48.7, label: "un conejo adulto pequeño",         emoji: "🐇" },
  { cm: 50,   label: "un bebé recién nacido",            emoji: "👶" }
];

// Distancia proporcional (en escala logarítmica) para que la comparación
// tenga sentido tanto en semanas tempranas (mm) como tardías (cm grandes).
function nearestSizeReference(cm){
  let best = SIZE_REFERENCE[0], bestDist = Infinity;
  for (const ref of SIZE_REFERENCE){
    const dist = Math.abs(Math.log(cm) - Math.log(ref.cm));
    if (dist < bestDist){ bestDist = dist; best = ref; }
  }
  return best;
}

const today = new Date();
const fumDate = parseDate(DATA.fechas.fecha_ultima_menstruacion);
const fppDate = parseDate(DATA.fechas.fecha_probable_parto);

const gestDays = Math.max(0, diffDays(fumDate, today));
const gestWeeks = Math.floor(gestDays / 7);
const gestRemDays = gestDays % 7;
const diasParaFpp = diffDays(today, fppDate);

let trimestreLabel, trimestreNum;
if (gestWeeks < 13) { trimestreNum = 1; trimestreLabel = "Primer trimestre"; }
else if (gestWeeks < 27) { trimestreNum = 2; trimestreLabel = "Segundo trimestre"; }
else { trimestreNum = 3; trimestreLabel = "Tercer trimestre"; }

// ---------------------------------------------------------------
// Encabezado + hero
// ---------------------------------------------------------------
document.getElementById("nombreMadre").textContent = DATA.madre.nombre.split(" ").slice(0,2).join(" ");
document.getElementById("badgeObraSocial").textContent = DATA.madre.obra_social.actual;

document.getElementById("heroWeeks").textContent = gestWeeks;
document.getElementById("heroPrecise").innerHTML =
  `<b>${gestWeeks} semanas${gestRemDays ? " y " + gestRemDays + (gestRemDays===1?" día":" días") : ""}</b> de gestación, contadas desde la fecha de última menstruación (${fmtLong(fumDate)}).`;
document.getElementById("heroTrimestre").textContent = trimestreLabel;
document.getElementById("heroFpp").innerHTML =
  `Fecha probable de parto: <b>${fmtLong(fppDate)}</b> · ${diasParaFpp > 0 ? "faltan aproximadamente " + diasParaFpp + " días" : "fecha alcanzada"}.`;

// ---------------------------------------------------------------
// Hero secundario — tamaño aproximado
// ---------------------------------------------------------------
(function(){
  const cm = fetalSizeCm(gestDays);
  const ref = nearestSizeReference(cm);
  const cmLabel = cm.toLocaleString("es-AR", { minimumFractionDigits: cm < 10 ? 2 : 1, maximumFractionDigits: cm < 10 ? 2 : 1 });

  document.getElementById("sizeEmoji").textContent = ref.emoji;
  document.getElementById("sizeHeadline").innerHTML =
    `Mide aproximadamente <b>${cmLabel} cm</b> · como ${ref.label}`;
  document.getElementById("sizeCaption").textContent =

// ---------------------------------------------------------------
// Dial de 40 semanas — cada semana es una puntada
// ---------------------------------------------------------------
(function drawDial(){
  const svg = document.getElementById("dial");
  const NS = "http://www.w3.org/2000/svg";
  const cx = 160, cy = 172, rOuter = 128;
  const totalWeeks = 40;
  const boundaries = [13, 27, 40];
  const currentTick = Math.min(gestWeeks, totalWeeks);

  for (let w = 1; w <= totalWeeks; w++){
    const t = (w - 1) / (totalWeeks - 1);
    const angleDeg = 180 - t * 180;
    const angleRad = angleDeg * Math.PI / 180;
    const isBoundary = boundaries.includes(w);
    const len = isBoundary ? 20 : 11;
    const rInner = rOuter - len;
    const stitched = w <= currentTick;

    const x1 = cx + rOuter * Math.cos(angleRad);
    const y1 = cy - rOuter * Math.sin(angleRad);
    const x2 = cx + rInner * Math.cos(angleRad);
    const y2 = cy - rInner * Math.sin(angleRad);

    const line = document.createElementNS(NS, "line");
    line.setAttribute("x1", x1.toFixed(2));
    line.setAttribute("y1", y1.toFixed(2));
    line.setAttribute("x2", x2.toFixed(2));
    line.setAttribute("y2", y2.toFixed(2));
    line.setAttribute("stroke-width", isBoundary ? 2.6 : 1.6);
    line.setAttribute("stroke-linecap", "round");
    line.setAttribute("class", (stitched ? "tick-stitched" : "tick-unstitched") + (isBoundary ? " tick-boundary" : ""));
    svg.appendChild(line);
  }

  // etiquetas de referencia
  [[1,"0"], [13,"13"], [27,"27"], [40,"40"]].forEach(([w, label]) => {
    const t = (w - 1) / (totalWeeks - 1);
    const angleDeg = 180 - t * 180;
    const angleRad = angleDeg * Math.PI / 180;
    const r = rOuter + 14;
    const x = cx + r * Math.cos(angleRad);
    const y = cy - r * Math.sin(angleRad);
    const txt = document.createElementNS(NS, "text");
    txt.setAttribute("x", x.toFixed(2));
    txt.setAttribute("y", (y + 4).toFixed(2));
    txt.setAttribute("class", "dial-label");
    txt.textContent = label;
    svg.appendChild(txt);
  });

  // marcador de semana actual
  if (currentTick >= 1){
    const t = (currentTick - 1) / (totalWeeks - 1);
    const angleDeg = 180 - t * 180;
    const angleRad = angleDeg * Math.PI / 180;
    const r = rOuter - 5;
    const x = cx + r * Math.cos(angleRad);
    const y = cy - r * Math.sin(angleRad);
    const dot = document.createElementNS(NS, "circle");
    dot.setAttribute("cx", x.toFixed(2));
    dot.setAttribute("cy", y.toFixed(2));
    dot.setAttribute("r", 6);
    dot.setAttribute("class", "marker");
    svg.appendChild(dot);
  }
})();

const grid = document.getElementById("grid");

function card(html){
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = html;
  grid.appendChild(div);
  return div;
}

// Próximo control — el item "pendiente" del timeline con fecha mas cercana a hoy
(function(){
  const pendientes = DATA.timeline
    .filter(t => t.estado === "pendiente")
    .map(t => ({ ...t, dateObj: parseDate(t.fecha) }))
    .sort((a, b) => Math.abs(diffDays(today, a.dateObj)) - Math.abs(diffDays(today, b.dateObj)));

  const c = card(`<h2>Próximo control</h2>`);
  c.classList.add("turno");

  if (!pendientes.length){
    c.innerHTML += `<p class="muted">No hay turnos pendientes cargados.</p>`;
    return;
  }

  const turno = pendientes[0];
  const diasFaltan = diffDays(today, turno.dateObj);
  c.innerHTML += `
    <div class="row"><span class="k">Fecha</span><span class="v">${fmtLong(turno.dateObj)}</span></div>
    <div class="row"><span class="k">Día</span><span class="v">${fmtWeekday(turno.dateObj)}</span></div>
    <div class="row"><span class="k">Motivo</span><span class="v">${turno.estudio}</span></div>
    <div class="row"><span class="k">Semana de gestación</span><span class="v">${gestLabelFor(turno.dateObj, fumDate)}</span></div>
    ${turno.preparacion ? `<p class="muted" style="margin-top:12px; padding-top:12px; border-top:1px dashed var(--hair);"><b style="color:var(--ink);">Preparación:</b> ${turno.preparacion}</p>` : ""}
    <div class="turno-days">${diasFaltan > 0 ? "Faltan " + diasFaltan + " días" : diasFaltan === 0 ? "Es hoy" : "Ya pasó"}</div>
  `;
})();

// Línea de tiempo — timeline completo, cada item con su semana de gestación calculada

    .map(t => ({ ...t, dateObj: parseDate(t.fecha) }))
    .sort((a, b) => a.dateObj - b.dateObj);

  const linkIcon = (url) => url ? `
    <a class="link-icon" href="${url}" target="_blank" rel="noopener" title="Ver estudio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
    </a>` : "";

  const itemHtml = (t) => `
    <li>

        ${t.estudio}

  `;
})();
